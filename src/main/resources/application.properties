# Application name shown in logs and Actuator metadata.
spring.application.name=visitor-app

# HSQLDB file-based database configuration.
# This creates/uses DB files under project folder (./data).
spring.datasource.url=jdbc:hsqldb:file:./data/visitor-db
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver

# JPA/Hibernate behavior.
# ddl-auto=update is good for learning/dev, but avoid in production migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.HSQLDialect

# JWT configuration. Use a strong secret in real environments.
security.jwt.secret=ReplaceThisWithAtLeast32BytesLongSecretKey123
security.jwt.expiration-ms=3600000

# Serve React UI from resources packaged inside the jar.
# Build process copies frontend/dist into classpath:/static.
spring.web.resources.static-locations=classpath:/static/

# Central log folder used by Log4j2 rolling file appender.
app.log.dir=logs
